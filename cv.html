<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — Marisa Cameron</title>
  <meta name="description" content="Curriculum vitae of Marisa Cameron, Economics PhD Candidate." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script src="nav.js"></script>

  <main class="page">
    <h1>Curriculum Vitae</h1>

    <div class="cv-frame-wrap" style="margin-top:1.5rem;">
      <!--
        Option A (recommended): link to a PDF you upload to your repo.
        Replace "cv.pdf" with the actual filename if different.
      -->
      <a href="cv.pdf" class="cv-download" target="_blank" rel="noopener">
        Download CV (PDF) &rarr;
      </a>

      <!--
        Option B: embed the PDF inline (remove the comment tags to enable).
        <iframe
          src="cv.pdf"
          width="100%"
          height="900"
          style="border: 1px solid var(--rule); margin-top: 1rem;"
          title="Marisa Cameron CV"
        ></iframe>
      -->

      <p style="margin-top:1rem; font-size:0.9rem; color:var(--ink-muted);">
        To update your CV, simply replace the <code>cv.pdf</code> file in your
        GitHub repository and push the change — the link above will always serve
        the latest version.
      </p>
    </div>
  </main>
</body>
</html>
